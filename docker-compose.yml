services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-frexo}
      POSTGRES_USER: ${POSTGRES_USER:-frexo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-frexo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-frexo} -d ${POSTGRES_DB:-frexo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      options: {max-size: "10m", max-file: "5"}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      options: {max-size: "10m", max-file: "5"}

  bot:
    build: .
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports:
      - "127.0.0.1:${HEALTH_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    logging:
      options: {max-size: "10m", max-file: "5"}

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-frexo}
      PGUSER: ${POSTGRES_USER:-frexo}
      PGPASSWORD: ${POSTGRES_PASSWORD:-frexo}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
    command: ["sh", "/scripts/backup_postgres.sh", "--loop"]
    depends_on:
      postgres: {condition: service_healthy}
    logging:
      options: {max-size: "5m", max-file: "3"}

volumes:
  postgres_data:
  redis_data:
